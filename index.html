<!doctype html>
<html lang="en">
<head>

<title>Stan Abada</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: single centered column card-less stack; name on top, three full-width action buttons below. */
:root {
  --bg: #f3f5f7;
  --fg: #11202b;
  --muted: #55646f;
  --line: #d5dce2;
  --surface: #ffffff;
  --accent: #0b5c8f;
  --accent-fg: #ffffff;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d; --fg: #eaf0f4; --muted: #9aa9b4; --line: #26353f;
    --surface: #15222b; --accent: #5db4ea; --accent-fg: #07161f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d; --fg: #eaf0f4; --muted: #9aa9b4; --line: #26353f;
  --surface: #15222b; --accent: #5db4ea; --accent-fg: #07161f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 2.4rem; line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.role { color: var(--muted); margin: 0; text-wrap: balance; }
nav { display: flex; flex-direction: column; gap: 12px; }
.btn {
  display: flex; align-items: center; gap: 16px; min-width: 0;
  padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--fg); text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn svg { flex: none; width: 28px; height: 28px; fill: currentColor; }
.btn .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.btn .label { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.btn .sub { font-size: 13px; opacity: .8; overflow-wrap: anywhere; }
.btn .arrow { flex: none; font-size: 1.3rem; }
footer { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>

</head>

  </nav>

</html>
